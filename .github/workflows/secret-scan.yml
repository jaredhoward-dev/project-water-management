name: secret-scan

# Secret scan with TruffleHog OSS. Catches accidentally-committed AWS keys,
# the JWT signing secret, sops plaintext, admin tokens — anything one of its
# ~800 detectors recognises — and checks each candidate against its provider
# to say whether it is live.
#
# CALLED, not triggered (estate standard: threkir's secret scan):
#   - ci.yml's `secret-scan` job runs it on every push to main and every PR,
#     so a detection fails the `CI gate`. A red row on its own triggers could
#     never block anything: the gate is the one check that matters, and a
#     `needs:` entry cannot name another workflow's job.
#   - secret-scan-sweep.yml runs it weekly over the whole history, and opens
#     an issue when it fails (that reporting needs `issues: write`, which
#     ci.yml's caller has no reason to hold, so the cron lives there).
#   In a called workflow `github.event_name` is the caller's event, so the
#   Scan step below still picks the PR / push range, and the whole history
#   for the sweep's schedule / workflow_dispatch (and ci.yml's
#   workflow_dispatch).
#
# Complements existing controls:
#   - CodeQL (security.yml) finds source-level injection bugs, not secrets.
#   - pnpm audit (audit.yml) flags CVEs in dependencies.
#   - scripts/guards/check_env_isolation.mjs (ci.yml `env-isolation`) checks
#     the committed env files point only at the local stack.
#   - sops + KMS in the private infra-secrets repo protects the secrets we
#     mean to keep; it doesn't catch a stray paste.
#   - The gitleaks pre-commit hook (.pre-commit-config.yaml, .gitleaks.toml)
#     — the local, pre-push layer. This workflow replaced the CI gitleaks
#     job: gitleaks-action needs a license key (sign-up plus a
#     secret) in a GitHub organization.
#
# Why the binary and not trufflesecurity/trufflehog's action: the action runs
# a Docker image by tag (default `latest`), so it can't be pinned by digest.
# This installs the official release tarball, checked against the sha256
# below (from the release's trufflehog_<version>_checksums.txt). Bump
# TRUFFLEHOG_VERSION and TRUFFLEHOG_SHA256 together, to a release at least
# 7 days old. TruffleHog is AGPL-3.0; running it unmodified in CI creates no
# obligation (nothing is distributed or served to users).
#
# Scope (the same ranges the action computes):
#   - pull_request: the PR's commits (base.sha..head.sha).
#   - push to main: the pushed range (before..after); the whole history if
#     `before` is not in the clone (a force push).
#   - schedule / workflow_dispatch (the caller's event): the whole history.
#
# What fails the job:
#   - verified: the provider accepted the credential. It is live: rotate it
#     first, then deal with the commit. Once rotated it stops verifying, so
#     the next run passes without rewriting history.
#   - unknown: verification errored, so it may be live. Re-run; if it
#     persists, check the credential by hand.
# What only warns (annotation + job summary, job stays green):
#   - unverified: matched a detector but the provider rejected it or the
#     detector cannot verify. Mostly test fixtures, placeholders and dead
#     keys; look at each one, and mark a reviewed false positive with a
#     `trufflehog:ignore` comment on its line.
#   - A synthetic value whose host doesn't resolve (a test fixture's
#     `db.example.org`) comes back `unknown`: the verifier tried to connect
#     and the lookup failed. In the change that adds it, put
#     `trufflehog:ignore` on its line. That can't reach a commit already
#     pushed, so the weekly whole-history sweep would fail on it for ever
#     (issue #818): after reading the line and confirming the value is
#     synthetic, list the exact finding (full commit, file, line, detector)
#     in .github/secret-scan-reviewed.txt. A listed finding is reported as
#     `reviewed` (a notice) instead; a new commit, file, line or detector is
#     never covered, and a verified finding fails even when listed. No path
#     or detector is excluded from the scan.
#
# The Report findings step runs scripts/ci/secret_scan_report.py, which also
# fails when the reviewed file names a commit that is not in the clone.
#
# Data flow: verification sends each candidate only to the API of the
# service that issued it (e.g. AWS STS GetCallerIdentity). No source code
# leaves GitHub. --no-update stops the self-update check. Results are written
# to a file, never the log, and the summary never prints a secret.

on:
  workflow_call:

# A called workflow cannot escalate past what the calling job grants; the job
# asks only for `contents: read`, which both callers grant.
permissions: {}

jobs:
  scan:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the history to scan
    env:
      TRUFFLEHOG_VERSION: 3.99.8
      TRUFFLEHOG_SHA256: 7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08 # trufflehog_3.99.8_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scheduled sweep scans all of it, and the
          # PR / push ranges need both of their ends in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog (pinned release, sha256-verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trufflehog"
          tarball="$dir/trufflehog.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir" trufflehog
          "$dir/trufflehog" --version

      # A non-zero exit here is a scan error (findings never set it, since
      # --fail is not passed), so a broken scan never reads as clean.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=(git "file://$PWD" --json --no-update --no-color
            --results=verified,unknown,unverified)
          case "$EVENT" in
            pull_request)
              args+=(--since-commit "$PR_BASE" --branch "$PR_HEAD")
              echo "Scanning: $PR_BASE..$PR_HEAD"
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "Push base not in the clone; scanning the whole history."
              else
                args+=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
                echo "Scanning: $PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
            *)
              echo "Scanning: the whole history"
              ;;
          esac
          "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" > "$RUNNER_TEMP/trufflehog.jsonl"

      - name: Report findings
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ runner.temp }}/trufflehog.jsonl
          REVIEWED: .github/secret-scan-reviewed.txt
        # The annotations, the job summary and the exit code are the script's
        # (its tests: scripts/ci/secret_scan_report.test.mjs, pnpm test:guards).
        run: python3 -I scripts/ci/secret_scan_report.py
